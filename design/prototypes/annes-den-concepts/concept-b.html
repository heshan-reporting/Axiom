<title>Anne's Den - Concept B, The Front Page (prototype, synthetic data)</title>
<script>
/* The theme is set before the first paint: the person's stored choice, else the system's. */
(function () {
  var t = 'auto';
  try { t = localStorage.getItem('den_b_theme') || 'auto'; } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
