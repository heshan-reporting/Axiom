<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guided Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@500;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
/* Concept C: one guided journey. Stages 1-4 and 6-7 are a single focused column under a stage navigator; stage 5 (Design) opens
   into a full-window canvas with controls that float beside what is selected, a version strip at the foot and a Creative Partner
   that slides in and out. Every wait shows the call, the time, the typical time and an estimated share, and never blocks. */
:root { --ground: #0b0e10; --panel: #1b1f22; --raised: #252a2e; --line: #2e3438; --line-soft: #252b2f; --ink: #e9edef; --ink-2: #b4bcc2; --ink-3: #848e95;
  --accent: #2fd27a; --accent-ink: #04210f; --accent-soft: rgba(47,210,122,.12); --sel: #2fd27a; }
body { margin: 0; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: rgba(16,19,24,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); }
.top .in { max-width: 1180px; margin: 0 auto; padding: 12px max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); }
.title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.title h1 { font: 800 17px/1.2 var(--display); margin: 0; }
.title .sub { color: var(--ink-3); font-size: 12.5px; }
.title .grow { flex: 1; }
.steps { display: flex; gap: 4px; margin-top: 12px; overflow-x: auto; }
.step { flex: 1 0 128px; border: 0; background: none; color: var(--ink-3); text-align: left; padding: 8px 4px 10px; border-bottom: 2px solid var(--line); cursor: pointer; }
.step .n { font: 700 11px/1 var(--mono); letter-spacing: .06em; }
.step .t { display: block; font: 700 13px/1.25 var(--display); margin-top: 4px; color: var(--ink-2); }
.step.done { border-color: var(--good); }
.step.done .n::after { content: ' ✓'; color: var(--good); }
.step.cur { border-color: var(--accent); }
.step.cur .t { color: var(--ink); }
.step[disabled] { cursor: not-allowed; opacity: .55; }
.next { font-size: 12.5px; color: var(--ink-3); padding: 0 0 10px; }
.next b { color: var(--ink-2); font-weight: 600; }
.col { max-width: 760px; margin: 0 auto; padding: 28px max(20px, env(safe-area-inset-right, 0px)) 80px max(20px, env(safe-area-inset-left, 0px)); }
.eyebrow { font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.col h2 { font: 800 30px/1.15 var(--display); margin: 8px 0 8px; letter-spacing: -.01em; text-wrap: balance; }
.col .lead { color: var(--ink-2); font-size: 15px; margin: 0 0 22px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
.card h3 { font: 700 15px/1.3 var(--display); margin: 0 0 8px; }
.src { font-size: 14px; color: var(--ink-2); border-left: 3px solid var(--line); padding-left: 12px; margin: 0; }
.btn { border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-size: 13.5px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fld { display: grid; gap: 6px; margin-bottom: 14px; }
.fld label { font-size: 12.5px; color: var(--ink-3); display: flex; justify-content: space-between; }
.fld input, .fld textarea { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font: 14px/1.45 var(--body); padding: 9px 11px; }
.src-chip { font: 600 10.5px/1 var(--mono); color: var(--ink-3); }
.obj { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.obj:first-child { border-top: 0; }
.obj .rk { font: 800 18px/1 var(--display); color: var(--ink-3); }
.opt { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; cursor: pointer; background: var(--panel); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { position: absolute; opacity: 0; }
.opt .th { width: 64px; }
.opt b { font: 700 15px/1.25 var(--display); }
.opt p { margin: 3px 0 0; font-size: 13px; color: var(--ink-2); }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.tab { border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.sugg { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }
.landed { border: 1px solid rgba(93,212,229,.35); background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; font-size: 13.5px; }
/* the wait: what runs, how long, how long it usually takes, an estimated share; never blocks */
.runs { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: grid; gap: 8px; width: min(320px, calc(100vw - 32px)); }
.run { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.run .h { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.run .h b { font-weight: 700; }
.run .phase { font-size: 12.5px; color: var(--ink-2); margin: 4px 0 8px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .5s linear; }
.run .nums { display: flex; justify-content: space-between; font: 12px/1.4 var(--mono); color: var(--ink-3); margin-top: 6px; font-variant-numeric: tabular-nums; }
.run .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12px; color: var(--ink-3); }
.run.done { border-color: rgba(111,211,154,.4); }
.run.done .bar i { background: var(--good); }
/* review */
.piece { display: grid; grid-template-columns: 120px 1fr; gap: 16px; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
.trio > div { border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px; font-size: 12.5px; color: var(--ink-2); }
.trio .lbl { font: 600 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 6px; }
/* ---------- Design: the editor, after the reference (rail, Add panel, canvas, Style panel) ---------- */
.studio { position: fixed; inset: 0; z-index: 8; background: #050708; display: none; padding: 10px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
.studio.on { display: block; }
body.studio-on .top, body.studio-on .col { visibility: hidden; }
.ed { height: 100%; display: grid; grid-template-columns: 64px auto minmax(0, 1fr) 320px; grid-template-rows: 54px minmax(0, 1fr); grid-template-areas: "top top top top" "rail fly canvas style"; background: var(--panel); border: 1px solid #2a3034; border-radius: 18px; overflow: hidden; }
.ed-top { grid-area: top; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid #262c30; position: relative; }
.ed-ib { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 0; background: #262b2f; color: var(--ink); cursor: pointer; }
.ed-ib svg, .rail-b svg, .tile svg, .seg svg { width: 18px; height: 18px; }
.ed-step { font: 600 12px/1 var(--mono); color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.ed-step b { color: var(--ink); font: 700 13px/1 var(--display); letter-spacing: 0; text-transform: none; margin-left: 6px; }
.ed-center { position: absolute; left: 50%; top: 0; height: 100%; transform: translateX(-50%); display: flex; align-items: stretch; }
.ed-devices { display: flex; align-items: stretch; }
.ed-dev { width: 58px; border: 0; border-right: 1px solid #262c30; background: transparent; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; }
.ed-dev:first-child { border-left: 1px solid #262c30; }
.ed-dev svg { width: 18px; height: 22px; }
.ed-dev[aria-selected="true"] { background: var(--accent); color: #062512; }
.ed-meta { display: flex; align-items: center; gap: 6px; padding: 0 16px; font: 13px/1 var(--body); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ed-meta i { font-style: normal; color: var(--ink-3); }
.ed-actions { margin-left: auto; display: flex; gap: 8px; }
.ed-btn { height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #30373b; background: #262b2f; color: var(--ink); cursor: pointer; font: 600 13px/1 var(--body); white-space: nowrap; }
.ed-btn.primary { background: var(--accent); border-color: var(--accent); color: #062512; }
.ed-btn[disabled] { opacity: .5; cursor: progress; }
.ed-menupop { position: absolute; top: 50px; left: 10px; z-index: 9; width: 260px; background: #23282c; border: 1px solid #30373b; border-radius: 12px; padding: 6px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
.ed-menupop button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.ed-menupop button:hover { background: #2d3337; }
.ed-menupop p { margin: 6px 10px; font-size: 12px; color: var(--ink-3); }
.ed-rail { grid-area: rail; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 0; border-right: 1px solid #262c30; }
.rail-b { width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: #c9d0d4; display: grid; place-items: center; cursor: pointer; position: relative; }
.rail-b:hover { background: #262b2f; }
.rail-b[aria-pressed="true"] { background: #2b3135; color: #fff; }
.rail-b.add { background: var(--accent); color: #062512; }
.rail-b.add[aria-pressed="true"] { background: var(--accent); box-shadow: 0 0 0 3px rgba(47,210,122,.25); }
.rail-b .dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.rail-sp { flex: 1; }
.ed-fly { grid-area: fly; width: 296px; border-right: 1px solid #262c30; overflow: auto; background: var(--panel); }
.ed-fly[hidden] { display: none; }
.fly-h { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 10px; }
.fly-h h2 { font: 500 21px/1.1 var(--display); margin: 0; }
.fly-x { border: 0; background: none; color: var(--ink); cursor: pointer; padding: 4px; }
.fsec { border-top: 1px solid #262c30; }
.fsec > button { width: 100%; display: flex; justify-content: space-between; align-items: center; border: 0; background: none; color: var(--ink); font: 600 15px/1 var(--display); padding: 15px 18px; cursor: pointer; }
.fsec > button svg { width: 12px; height: 12px; transition: transform .15s; }
.fsec > button[aria-expanded="false"] svg { transform: rotate(180deg); }
.fsec .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 18px 18px; }
.tile { border: 1px solid #30373b; background: #262b2f; border-radius: 10px; color: var(--ink-2); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 9px; font: 600 11px/1.1 var(--body); }
.tile:hover { border-color: #49535a; color: var(--ink); }
.tile .ic { width: 46px; height: 34px; border-radius: 6px; border: 1.5px solid #59636a; display: grid; place-items: center; color: #c9d0d4; }
.tile .mini { width: 46px; border-radius: 4px; overflow: hidden; }
.flist { padding: 0 10px 14px; }
.lrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) 26px 26px; gap: 6px; align-items: center; padding: 8px 8px; border-radius: 8px; cursor: pointer; font-size: 13.5px; color: var(--ink-2); }
.lrow:hover { background: #24292d; }
.lrow.on { background: var(--accent); color: #062512; font-weight: 600; }
.lrow button { border: 0; background: none; color: inherit; cursor: pointer; opacity: .8; }
.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 18px 16px; }
.sw { display: grid; gap: 6px; font-size: 11.5px; color: var(--ink-3); }
.sw i { display: block; height: 42px; border-radius: 10px; border: 1px solid #ffffff22; }
.fnote { margin: 0 18px 14px; padding: 10px 12px; border-radius: 10px; background: #23282c; font-size: 12.5px; color: var(--ink-2); }
.fnote b { color: var(--ink); }
.pmsg { margin: 0 14px 10px; padding: 11px 12px; border-radius: 10px; background: #23282c; font-size: 13px; color: var(--ink-2); }
.pmsg b { color: var(--ink); }
.pform { display: flex; gap: 8px; padding: 6px 14px 16px; }
.pform input { flex: 1; min-width: 0; background: #262b2f; border: 1px solid #30373b; border-radius: 10px; color: var(--ink); padding: 9px 11px; font: 13px var(--body); }
.ed-canvas { grid-area: canvas; position: relative; overflow: hidden; background: #111518; display: grid; place-items: center; }
.ed-art { position: relative; }
#tile { width: min(54vh, 560px); box-shadow: 0 24px 70px rgba(0,0,0,.55); }
#tile.story { width: min(40vh, 400px); }
#tile .hl-layer { cursor: move; }
#tile .hl-layer.sel { outline: none; }
.selbox { position: absolute; border: 2px solid var(--sel); pointer-events: none; }
.selbox .tag { position: absolute; left: -2px; bottom: 100%; margin-bottom: 4px; background: var(--sel); color: #062512; font: 500 13px/1 var(--body); padding: 6px 10px; border-radius: 4px 4px 0 0; white-space: nowrap; }
.selbox .h { position: absolute; width: 9px; height: 9px; background: #fff; border: 2px solid var(--sel); transform: translate(-50%, -50%); }
.sketch { position: absolute; inset: 0; display: grid; place-items: center; background: repeating-linear-gradient(135deg, #1b2a35 0 10px, #1f303c 10px 20px); color: #9fb4c2; font: 600 3.4cqw/1.3 var(--body); text-align: center; padding: 10%; }
.check-line { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 92%; }
.vstrip { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: linear-gradient(transparent, rgba(11,14,16,.96) 35%); overflow-x: auto; }
.vstrip .lbl { font: 600 11px/1 var(--mono); letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; margin-right: 4px; white-space: nowrap; }
.vcard { flex: 0 0 auto; width: 46px; border: 2px solid transparent; border-radius: 6px; overflow: hidden; cursor: pointer; padding: 0; background: none; position: relative; }
.vcard.on { border-color: var(--accent); }
.vcard em { position: absolute; left: 2px; bottom: 2px; font: 700 9.5px/1 var(--mono); background: rgba(0,0,0,.75); color: #fff; padding: 2px 3px; border-radius: 3px; font-style: normal; }
.ed-style { grid-area: style; border-left: 1px solid #262c30; overflow: auto; background: var(--panel); }
.st-h { padding: 18px 16px 6px; font: 500 17px/1 var(--display); }
.st-chip { margin: 6px 16px 4px; display: flex; align-items: center; justify-content: space-between; background: #262b2f; border: 1px solid #30373b; border-radius: 10px; padding: 5px 6px 5px 5px; }
.st-chip select { appearance: none; -webkit-appearance: none; border: 0; background: var(--accent); color: #062512; font: 600 13px/1 var(--body); padding: 7px 10px; border-radius: 7px; cursor: pointer; }
.st-chip svg { width: 12px; height: 12px; color: var(--ink-3); margin-right: 6px; }
.st-sub { padding: 0 16px 12px; font-size: 12px; color: var(--ink-3); }
.ssec { border-top: 1px solid #262c30; }
.ssec > button { width: 100%; display: flex; justify-content: space-between; align-items: center; border: 0; background: none; color: var(--ink); font: 500 15.5px/1 var(--display); padding: 16px; cursor: pointer; }
.ssec > button svg { width: 12px; height: 12px; transition: transform .15s; }
.ssec > button[aria-expanded="false"] svg { transform: rotate(180deg); }
.ssec .body { padding: 0 16px 16px; }
.box { position: relative; background: #262b2f; border-radius: 10px; padding: 26px 34px; font: 12px/1 var(--body); color: var(--ink-2); }
.box .lab { position: absolute; top: 7px; left: 9px; font-size: 10.5px; color: var(--ink-3); }
.box .inner { position: relative; border: 1px solid #4a545b; border-radius: 6px; padding: 24px 30px; background: #2b3135; }
.box .inner .core { height: 18px; border: 1px solid #59636a; border-radius: 3px; display: grid; place-items: center; font-size: 10.5px; color: var(--ink-3); }
.box input { position: absolute; width: 46px; background: transparent; border: 0; color: var(--ink); font: 12.5px var(--body); text-align: center; font-variant-numeric: tabular-nums; }
.box input:focus { background: #1b1f22; border-radius: 4px; outline: 1px solid var(--accent); }
.box .t { top: 7px; left: 50%; transform: translateX(-50%); } .box .b { bottom: 6px; left: 50%; transform: translateX(-50%); }
.box .l { left: -6px; top: 50%; transform: translateY(-50%); } .box .r { right: -6px; top: 50%; transform: translateY(-50%); }
.f2 { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px minmax(0, 1fr); gap: 10px 8px; align-items: center; }
.f2 > span, .frow > span { font-size: 13px; color: var(--ink-2); }
.fld { display: flex; align-items: center; background: #262b2f; border: 1px solid #2f363a; border-radius: 8px; height: 38px; padding: 0 8px; min-width: 0; }
.fld input, .fld select { flex: 1; min-width: 0; background: none; border: 0; color: var(--ink); font: 13px var(--body); outline: none; font-variant-numeric: tabular-nums; }
.fld select { appearance: none; -webkit-appearance: none; cursor: pointer; }
.fld i { font-style: normal; font-size: 12px; color: var(--ink-3); margin-left: 4px; }
.fld svg { width: 12px; height: 12px; color: var(--ink-2); pointer-events: none; }
.fld:focus-within { border-color: var(--accent); }
.frow { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; align-items: center; margin-top: 10px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: #262b2f; border-radius: 10px; overflow: hidden; }
.seg button { height: 40px; border: 0; border-right: 1px solid #1b1f22; background: transparent; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; font: 600 13px var(--body); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #062512; }
.colorbtn { display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; border: 1px solid #2f363a; border-radius: 8px; background: #1b1f22; color: var(--ink); cursor: pointer; padding: 0 10px; font: 13px var(--mono); }
.colorbtn i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #ffffff44; }
.contrast { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 12.5px; color: var(--ink-2); }
.contrast b { font-weight: 600; }
.g-aaa, .g-aa { color: var(--accent); } .g-large { color: var(--warn); } .g-fail { color: var(--bad); }
.rule { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(242,193,78,.08); border: 1px solid rgba(242,193,78,.3); font-size: 12.5px; color: var(--ink-2); }
.ed-picker { position: fixed; z-index: 35; width: 350px; background: #23282c; border: 1px solid #343b40; border-radius: 22px; padding: 14px; box-shadow: 0 26px 70px rgba(0,0,0,.6); }
.ed-picker[hidden] { display: none; }
.sb { position: relative; height: 220px; border-radius: 14px; cursor: crosshair; touch-action: none; }
.sb .knob, .slider .knob { position: absolute; width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 0 0 1px #0006; transform: translate(-50%, -50%); pointer-events: none; }
.prow { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: center; margin-top: 14px; }
.eyedrop { width: 36px; height: 36px; border-radius: 10px; border: 0; background: #2d3337; color: var(--ink); display: grid; place-items: center; }
.sliders { display: grid; gap: 12px; }
.slider { position: relative; height: 12px; border-radius: 6px; cursor: pointer; touch-action: none; }
.slider.hue { background: linear-gradient(90deg, #f00, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00); }
.slider.alpha { background-image: linear-gradient(90deg, transparent, var(--cur, #fff)), repeating-conic-gradient(#555 0 25%, #888 0 50%); background-size: 100% 100%, 10px 10px; }
.slider .knob { top: 50%; }
.pnums { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr 1.3fr; gap: 6px; margin-top: 14px; }
.pnums > * { height: 40px; border-radius: 10px; background: #2d3337; border: 1px solid #383f44; color: var(--ink); font: 14px var(--body); text-align: center; min-width: 0; }
.pnums select { appearance: none; -webkit-appearance: none; padding: 0 8px; text-align: left; }
.prat { display: flex; align-items: center; justify-content: space-between; margin: 16px 2px 6px; font-size: 15px; }
.prat b { font-weight: 600; margin-left: 10px; }
.psaved { font-size: 14px; color: var(--ink-2); margin: 14px 2px 10px; }
.psw { display: flex; gap: 10px; flex-wrap: wrap; }
.psw button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #ffffff26; cursor: pointer; }
.psw button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
body.studio-on .runs { left: auto; right: calc(336px + max(10px, env(safe-area-inset-right, 0px))); bottom: calc(104px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100vw - 32px)); }
body.studio-on .run .foot span { display: none; }
@media (max-width: 1100px) { .ed { grid-template-columns: 56px auto minmax(0, 1fr); grid-template-areas: "top top top" "rail fly canvas"; } .ed-style { position: absolute; right: 10px; top: 64px; bottom: 10px; width: 290px; border-radius: 0 0 18px 0; box-shadow: -10px 0 30px rgba(0,0,0,.4); } .ed-fly { position: absolute; left: 66px; top: 64px; bottom: 10px; z-index: 3; box-shadow: 10px 0 30px rgba(0,0,0,.4); } body.studio-on .runs { right: 16px; } }
@media (max-width: 720px) { .ed-meta, .ed-step { display: none; } .ed-center { position: static; transform: none; } .ed-actions .ed-btn:not(.primary) { display: none; } .ed { grid-template-columns: 52px minmax(0, 1fr); grid-template-rows: 54px minmax(0, 1fr) 42%; grid-template-areas: "top top" "rail canvas" "style style"; } .ed-style { position: static; width: auto; height: auto; border-left: 0; border-top: 1px solid #262c30; box-shadow: none; border-radius: 0; } .ed-rail { gap: 6px; padding: 8px 0; overflow-y: auto; } .rail-b { width: 40px; height: 40px; } .ed-fly { left: 58px; top: 64px; bottom: 42%; width: min(296px, calc(100vw - 80px)); } #tile { width: min(62vw, 34vh); } #tile.story { width: min(44vw, 28vh); } .vstrip { height: 70px; } .check-line { top: 6px; } body.studio-on .runs { right: 16px; bottom: calc(42% + 16px); } }
.toast { position: fixed; left: 50%; top: 80px; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 40; }
.toast.on { opacity: 1; }
@media (max-width: 720px) { .piece { grid-template-columns: 1fr; } .trio { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="in">
    <div class="title"><h1 id="ptitle"></h1><span class="sub" id="psub"></span><div class="grow"></div><span class="chip">Concept C · Guided Production</span></div>
    <nav class="steps" id="steps" aria-label="Stages"></nav>
    <div class="next" id="next" aria-live="polite"></div>
  </div>
</header>
<main class="col" id="col"></main>
<section class="studio" id="studio" aria-label="Design studio">
  <div class="ed">
    <header class="ed-top">
      <button class="ed-ib" id="edMenu" aria-label="Steps and keyboard" aria-expanded="false" aria-controls="menuPop"><svg viewBox="0 0 18 18"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <span class="ed-step">5 of 7<b>Design</b></span>
      <div class="ed-center"><div class="ed-devices" role="tablist" aria-label="Pieces" id="pieces"></div><div class="ed-meta" id="edMeta"></div></div>
      <div class="ed-actions"><button class="ed-btn" id="genBtn">Generate photograph</button><button class="ed-btn primary" id="toReview">Review</button></div>
      <div class="ed-menupop" id="menuPop" hidden><button id="backSteps">Back to the steps (Copy)</button><button id="menuReview">Done designing: go to Review</button><p>Drag on the canvas to move. Arrow keys nudge 1 px at output size, Shift 10. Esc clears.</p></div>
    </header>
    <nav class="ed-rail" aria-label="Tools" id="rail"></nav>
    <aside class="ed-fly" id="fly"></aside>
    <main class="ed-canvas" id="stagewrap" aria-label="Canvas"><div class="check-line" id="checkline" role="status" aria-live="polite"></div><div class="ed-art" id="art"><div id="tile"></div><div class="selbox" id="selbox" hidden></div></div><div class="vstrip" id="vstrip"></div></main>
    <aside class="ed-style" id="style" aria-label="Style"></aside>
  </div>
  <div class="ed-picker" id="picker" role="dialog" aria-label="Colour" hidden></div>
</section>
<div class="runs" id="runs" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="shared.js"></script>
<script>
(function () {
  const H = window.HL; const $ = s => document.querySelector(s);
  const STAGES = [
    { id: 'brief', t: 'Brief and objectives', next: 'Confirm what the brief asks; then audience, message and action.' },
    { id: 'shape', t: 'Audience, message, action, deliverables', next: 'Set who it is for and what it must make; then the creative direction.' },
    { id: 'dir', t: 'Creative direction', next: 'Choose one route; then the words.' },
    { id: 'copy', t: 'Copy development', next: 'Get the words right for each piece; then Design opens as a full canvas.' },
    { id: 'design', t: 'Design and image generation', next: 'Compose each piece on the canvas; then review.' },
    { id: 'review', t: 'Review and approval', next: 'Check what was measured, read the AI opinion, then approve as a person.' },
    { id: 'export', t: 'Export and delivery', next: 'Package the approved pieces.' },
  ];
  const st = { stage: 0, done: new Set(), objectives: null, dir: 'D1', copy: {}, copyReady: {}, piece: 'ig', sel: null, docs: {}, versions: {}, imagery: false, approved: {}, partnerOpen: false, sugg: null };
  H.project.deliverables.forEach(d => { st.copy[d.id] = Object.assign({}, H.copy); st.docs[d.id] = H.layout(d.format, 'dawn'); st.versions[d.id] = [{ n: 1, note: 'first layout, no photograph yet', lay: JSON.parse(JSON.stringify(st.docs[d.id])), img: false }]; });
  $('#ptitle').textContent = H.project.title; $('#psub').textContent = H.client.name + ' (' + H.client.tag + ') · ' + H.project.campaign;
  function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); }

  /* ---- the wait: a call runs in the background; its card says what it is, how long, how long it usually takes, and an estimate ---- */
  const runs = [];
  function startRun(o) {
    const r = { id: Math.random().toString(36).slice(2), label: o.label, role: o.role, typical: o.typical, phases: o.phases, t0: Date.now(), done: false, cancelled: false, onDone: o.onDone };
    runs.push(r); drawRuns(); return r;
  }
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  function drawRuns() {
    const now = Date.now();
    $('#runs').innerHTML = runs.map(r => {
      const el = (now - r.t0) / 1000; const pct = r.done ? 100 : Math.min(95, Math.round(el / r.typical * 100));
      const pi = r.done ? r.phases.length - 1 : Math.min(r.phases.length - 1, Math.floor(el / r.typical * r.phases.length));
      return `<div class="run${r.done ? ' done' : ''}" role="status"><div class="h"><b>${H.esc(r.label)}</b><span>${r.done ? 'done' : pct + '% est.'}</span></div>
        <div class="phase">${r.done ? 'Landed. ' + H.esc(r.doneText || '') : 'Step ' + (pi + 1) + ' of ' + r.phases.length + ': ' + H.esc(r.phases[pi])}</div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="${H.esc(r.label)}"><i style="width:${pct}%"></i></div>
        <div class="nums"><span>${fmt(r.done ? r.took : el)} elapsed</span><span>typically about ${fmt(r.typical)}</span></div>
        <div class="foot"><span title="What runs is named; the prompt, the key and the client material are never shown here">${H.esc(r.role)} · you can keep working</span>${r.done ? `<button class="btn" data-dismiss="${r.id}" style="padding:4px 10px">Dismiss</button>` : `<button class="btn" data-cancel="${r.id}" style="padding:4px 10px">Cancel</button>`}</div></div>`;
    }).join('');
    document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => { const r = runs.find(x => x.id === b.dataset.cancel); r.cancelled = true; runs.splice(runs.indexOf(r), 1); toast('Cancelled. A request already sent may still finish and be counted; nothing it returns is used.'); drawRuns(); });
    document.querySelectorAll('[data-dismiss]').forEach(b => b.onclick = () => { runs.splice(runs.findIndex(x => x.id === b.dataset.dismiss), 1); drawRuns(); });
  }
  setInterval(() => {
    let changed = false;
    runs.forEach(r => { if (!r.done && !r.cancelled && (Date.now() - r.t0) / 1000 >= r.typical * (0.85 + Math.random() * 0.1)) { r.done = true; r.took = (Date.now() - r.t0) / 1000; r.doneText = r.onDone() || ''; changed = true; setTimeout(() => { const i = runs.indexOf(r); if (i >= 0) { runs.splice(i, 1); drawRuns(); } }, 6000); } });
    if (runs.length) drawRuns(); if (changed) render();
  }, 500);
  const running = label => runs.some(r => !r.done && r.label === label);

  /* ---- the navigator ---- */
  function drawSteps() {
    $('#steps').innerHTML = STAGES.map((s, i) => { const open = i <= Math.max(...Array.from(st.done).map(Number).concat([-1])) + 1; return `<button class="step${st.done.has(i) ? ' done' : ''}${i === st.stage ? ' cur' : ''}" data-s="${i}" ${open ? '' : 'disabled'} aria-current="${i === st.stage ? 'step' : 'false'}"><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${s.t}</span></button>`; }).join('');
    $('#next').innerHTML = '<b>Now:</b> ' + STAGES[st.stage].t + ' · <b>Next:</b> ' + H.esc(STAGES[st.stage].next);
    document.querySelectorAll('.step[data-s]').forEach(b => b.onclick = () => go(+b.dataset.s));
  }
  function go(i) { st.stage = i; render(); window.scrollTo({ top: 0 }); }
  function complete(i, nextI) { st.done.add(i); go(nextI); }

  /* ---- stages ---- */
  function stageBrief() {
    const o = st.objectives;
    return `<span class="eyebrow">Step 1 of 7</span><h2>What is this brief asking for?</h2><p class="lead">Axiom reads the material against what it knows about ${H.esc(H.client.name)} and proposes the objectives. You confirm them before anything else happens.</p>
      <div class="card"><h3>The material</h3><p class="src">${H.esc(H.project.source)}</p></div>
      ${o ? `<div class="card"><h3>Objectives, ranked</h3>${o.map((x, i) => `<div class="obj"><span class="rk">${i + 1}</span><div><b>${H.esc(x.t)}</b><div style="font-size:13px;color:var(--ink-2)">${H.esc(x.why)}</div></div><span class="chip ${i === 0 ? 'accent' : ''}">${i === 0 ? 'lead' : 'support'}</span></div>`).join('')}</div>
        <div class="row"><button class="btn primary" id="okBrief">Confirm the objectives</button><button class="btn" id="reread">Read it again</button></div>`
        : `<div class="row"><button class="btn primary" id="read" ${running('Reading the brief') ? 'disabled' : ''}>${running('Reading the brief') ? 'Reading…' : 'Read the brief (1 model call)'}</button><span style="font-size:12.5px;color:var(--ink-3)">You can fill in the next step by hand while it reads.</span></div>`}`;
  }
  function bindBrief() {
    const read = () => startRun({ label: 'Reading the brief', role: 'Creative model', typical: 9, phases: ['sending the material', 'reading it against the client', 'writing the objectives'], onDone: () => { st.objectives = [{ t: 'Tell weekday riders the 6.40 and 7.10 start Monday 9 March', why: 'The notice is an announcement with a date: reach and clarity first.' }, { t: 'Name Pier 2 and Northbridge Wharf', why: 'Your brand rule: always name the wharf.' }, { t: 'Send them to plan a crossing', why: 'The action in your campaign kit.' }]; return '3 objectives proposed'; } });
    const b = $('#read'); if (b) b.onclick = () => { read(); render(); };
    const rr = $('#reread'); if (rr) rr.onclick = () => { st.objectives = null; read(); render(); };
    const ok = $('#okBrief'); if (ok) ok.onclick = () => complete(0, 1);
  }
  function stageShape() {
    const f = (id, l, v, src) => `<div class="fld"><label for="${id}">${l}<span class="src-chip">${src}</span></label><input id="${id}" value="${H.esc(v)}"></div>`;
    return `<span class="eyebrow">Step 2 of 7</span><h2>Who is it for, and what must it make?</h2><p class="lead">Each field says where it came from. Change anything; the rest of the journey follows these.</p>
      <div class="card">${f('aud', 'Audience', H.project.audience, 'from the brief')}${f('msg', 'Message', H.project.message, 'from the brief')}${f('act', 'Action', H.project.action, 'campaign kit')}</div>
      <div class="card"><h3>Deliverables</h3>${H.project.deliverables.map(d => `<label style="display:flex;gap:10px;align-items:center;padding:6px 0"><input type="checkbox" checked> ${d.label} <span class="chip">${d.format} · ${d.px}</span></label>`).join('')}</div>
      <div class="card"><h3>Requirements this project carries</h3>${H.requirements.map(r => `<div style="font-size:13px;padding:3px 0"><span class="chip">${r.id}</span> ${H.esc(r.text)} <span style="color:var(--ink-3)">(${H.esc(r.from)})</span></div>`).join('')}</div>
      <div class="row"><button class="btn primary" id="okShape">Confirm and choose a direction</button></div>`;
  }
  function stageDir() {
    const top = H.directions.slice(0, 3);
    return `<span class="eyebrow">Step 3 of 7</span><h2>Pick the route.</h2><p class="lead">Three routes, ranked by the Creative Partner for this brief. Choosing one sets the imagery brief and the layout idea for Design.</p>
      ${top.map(d => `<label class="opt"><input type="radio" name="dir" value="${d.id}" ${st.dir === d.id ? 'checked' : ''}><div class="th" data-th="${d.spec}"></div><div><b>${H.esc(d.name)}</b>${d.id === 'D1' ? ' <span class="chip accent">recommended</span>' : ''}<p>${H.esc(d.idea)}</p><p style="color:var(--ink-3)">${H.esc(d.cost)} · ${H.requirements.filter(r => (d.follows[r.id] || ['yes'])[0] === 'yes').length} of ${H.requirements.length} requirements met</p></div><span></span></label>`).join('')}
      <div class="row"><button class="btn primary" id="okDir">Use this route and write the copy</button></div>`;
  }
  function stageCopy() {
    const c = st.copy[st.piece]; const d = H.project.deliverables;
    const fld = (k, l, max, rows) => `<div class="fld"><label for="c_${k}">${l}<span class="src-chip">${(c[k] || '').length}${max ? ' / ' + max : ''}</span></label>${rows ? `<textarea id="c_${k}" rows="${rows}">${H.esc(c[k])}</textarea>` : `<input id="c_${k}" value="${H.esc(c[k])}">`}</div>`;
    const sug = st.sugg && st.sugg.piece === st.piece ? st.sugg : null;
    return `<span class="eyebrow">Step 4 of 7</span><h2>Get the words right first.</h2><p class="lead">One piece at a time. Ask the Creative Partner for options; they land beside the field, and you choose. Design opens when every piece is ready.</p>
      <div class="tabs" role="tablist">${d.map(x => `<button class="tab" role="tab" data-p="${x.id}" aria-selected="${x.id === st.piece}">${x.label}${st.copyReady[x.id] ? ' ✓' : ''}</button>`).join('')}</div>
      <div class="card">${fld('headline', 'Headline', 48)}<div class="sugg"><button class="btn" id="shorter" ${running('Shorter headline options') ? 'disabled' : ''}>Three shorter headlines (1 model call)</button></div>
        ${sug ? `<div class="landed"><b>Options landed.</b> ${sug.opts.map((o, i) => `<button class="btn" data-use="${i}" style="margin:4px 4px 0 0">${H.esc(o)}</button>`).join('')}</div>` : ''}
        ${fld('support', 'Supporting line', 90)}${fld('cta', 'Call to action', 24)}${fld('caption', 'Caption', 2200, 3)}${fld('alt', 'Alt text', 250, 2)}
        <div class="row" style="margin-top:4px">${H.checks(Object.assign({}, st.docs[st.piece], { layers: st.docs[st.piece].layers.map(l => l.role in c ? Object.assign({}, l, { text: c[l.role] }) : l) })).filter(x => /R1|R4|R5/.test(x.id)).map(x => `<span class="chip ${x.ok ? 'ok' : 'no'}">${x.ok ? '✓' : '!'} ${x.label}</span>`).join('')}</div></div>
      <div class="row"><button class="btn ${st.copyReady[st.piece] ? '' : 'primary'}" id="ready">${st.copyReady[st.piece] ? 'Ready for design ✓' : 'Mark this piece ready for design'}</button><button class="btn primary" id="okCopy" ${d.every(x => st.copyReady[x.id]) ? '' : 'disabled'}>Open the design canvas</button></div>`;
  }
  function stageReview() {
    const d = H.project.deliverables;
    return `<span class="eyebrow">Step 6 of 7</span><h2>Review what was made.</h2><p class="lead">Three different things, kept apart: what was measured, what the AI thinks, and what a person decides. Only the last is an approval.</p>
      ${d.map(x => { const cs = H.checks(st.docs[x.id]); const ok = cs.every(c => c.ok); return `<div class="card piece"><div data-rv="${x.id}"></div><div><h3>${x.label} <span class="chip">${x.format}</span></h3>
        <div class="trio"><div><span class="lbl">Measured</span>${ok ? '<span class="chip ok">every check passes</span>' : cs.filter(c => !c.ok).map(c => `<span class="chip no">${H.esc(c.label)}</span>`).join(' ')}</div>
        <div><span class="lbl">AI opinion</span>${st.versions[x.id].some(v => v.img) ? 'Reads in a second; the band holds the times; logo clear. Ship.' : 'No photograph yet: the opinion waits for the finished tile.'}</div>
        <div><span class="lbl">Person</span>${st.approved[x.id] ? '<span class="chip accent">approved by you</span>' : `<button class="btn" data-approve="${x.id}" ${ok ? '' : 'disabled title="Fix the measured checks first"'}>Approve design</button>`}</div></div>
        ${ok ? '' : `<button class="btn" data-fix="${x.id}" style="margin-top:10px">Back to the canvas to fix it</button>`}</div></div>`; }).join('')}
      <div class="row"><button class="btn primary" id="okReview" ${d.some(x => st.approved[x.id]) ? '' : 'disabled'}>Go to export</button></div>`;
  }
  function stageExport() {
    const d = H.project.deliverables; const inc = d.filter(x => st.approved[x.id]), out = d.filter(x => !st.approved[x.id]);
    return `<span class="eyebrow">Step 7 of 7</span><h2>Package and deliver.</h2><p class="lead">The package is stated before anything is drawn: exactly the approved versions, and what is left out and why.</p>
      <div class="card"><h3>In the package</h3>${inc.map(x => `<div style="font-size:13.5px;padding:3px 0">${x.label} · PNG ${x.px} · approved v${st.versions[x.id].length}</div>`).join('')}<div style="font-size:13.5px;padding:3px 0">Copy sheet (headline, support, CTA, caption, alt text) · manifest</div></div>
      ${out.length ? `<div class="card"><h3>Left out</h3>${out.map(x => `<div style="font-size:13.5px;padding:3px 0;color:var(--ink-2)">${x.label}: design not approved</div>`).join('')}</div>` : ''}
      <div class="row"><button class="btn primary" id="pack">Prepare the package</button><button class="btn" id="share">Share a review link with the client</button></div>`;
  }

  /* ---- Design: the editor (after the reference: rail, Add panel, canvas, Style panel) ---- */
  const doc = () => st.docs[st.piece]; const layer = id => doc().layers.find(l => l.id === id);
  const STAGE = { '4:5': [1080, 1350], '1:1': [1080, 1080], '9:16': [1080, 1920] };
  const dims = () => STAGE[doc().format];
  const px = (pc, axis) => Math.round(pc / 100 * dims()[axis]);
  const pcOf = (v, axis) => v / dims()[axis] * 100;
  const NAME = { headline: 'Headline', support: 'Supporting line', kicker: 'Kicker', cta: 'Button', band: 'Band', logo: 'Logo', board: 'Board' };
  const KIND = { text: 'Text', cta: 'Button', shape: 'Shape', logo: 'Logo', board: 'Board' };
  const lname = l => (NAME[l.role] || l.role.replace(/^\w/, c => c.toUpperCase())) + ' - ' + (KIND[l.type] || l.type);
  const SAVED = [['Harbour blue', '#0B4F6C'], ['Harbour gold', '#F2A541'], ['Paper', '#F7F4EE'], ['Ink', '#13232F'], ['White', '#FFFFFF'], ['Sea', '#2C6A85'], ['Dusk', '#1C3442'], ['Sand', '#E9C79A']];
  const I = {
    add: '<svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="currentColor" opacity=".0"/><path d="M9 4.5v9M4.5 9h9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    layers: '<svg viewBox="0 0 18 18"><path d="M9 2 2 6l7 4 7-4-7-4Z" fill="currentColor"/><path d="m2 9.5 7 4 7-4M2 12.5l7 4 7-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
    brand: '<svg viewBox="0 0 18 18"><path d="M9 1.5 16 5v8l-7 3.5L2 13V5Z" fill="currentColor"/><path d="M2 5l7 3.5L16 5M9 8.5v8" stroke="#1b1f22" stroke-width="1.4" fill="none"/></svg>',
    pieces: '<svg viewBox="0 0 18 18"><rect x="3" y="2" width="12" height="14" rx="2" fill="currentColor"/><path d="M6 6h6M6 9h6M6 12h4" stroke="#1b1f22" stroke-width="1.5" stroke-linecap="round"/></svg>',
    versions: '<svg viewBox="0 0 18 18"><path d="M4 3h6l4 4v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" fill="currentColor"/><path d="M10 3v4h4" fill="none" stroke="#1b1f22" stroke-width="1.4"/></svg>',
    partner: '<svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="7.5" fill="currentColor"/><path d="M10 3.8 6.2 9.8h3l-1 4.4 3.8-6h-3Z" fill="#1b1f22"/></svg>',
    checks: '<svg viewBox="0 0 18 18"><circle cx="4" cy="4" r="2" fill="currentColor"/><circle cx="4" cy="14" r="2" fill="currentColor"/><circle cx="14" cy="9" r="2" fill="currentColor"/><path d="M4 6v6M5.6 5.2C8 9 10 9 12 9" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
    help: '<svg viewBox="0 0 18 18"><path d="M3 3h12v9H8l-3.5 3v-3H3Z" fill="currentColor"/><path d="M7.3 6.4a1.8 1.8 0 1 1 2.4 1.7c-.5.2-.7.5-.7 1M9 10.5v.1" stroke="#1b1f22" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>',
    gear: '<svg viewBox="0 0 18 18"><path d="M9 1.5 15.5 5v8L9 16.5 2.5 13V5Z" fill="currentColor"/><circle cx="9" cy="9" r="2.6" fill="#1b1f22"/></svg>',

    const opts = d.layers.slice().reverse().map(x => `<option value="${x.id}" ${l && x.id === l.id ? 'selected' : ''}>${H.esc(lname(x))}</option>`).join('');
    let h = `<div class="st-h">Style</div><div class="st-chip"><select id="sSel" aria-label="Selected layer"><option value="">Nothing selected</option>${opts}</select>${I.down}</div><div class="st-sub">${l ? '1 layer selected' : 'Select a layer on the canvas'} · ${H.esc(H.project.deliverables.find(x => x.id === st.piece).label)} ${d.format}</div>`;
    if (l) {
      const [W, Hh] = dims(); const T = px(l.y, 1), L = px(l.x, 0), R = W - px(l.x + l.w, 0), B = Hh - px(l.y + l.h, 1);
      const pad = l.type === 'cta' ? [12, 24, 12, 24] : [0, 0, 0, 0];
      h += ssec('spacing', 'Spacing', `<div class="box"><span class="lab">To the edges (px)</span><input class="t" data-edge="t" value="${T}" aria-label="Distance to the top"><input class="r" data-edge="r" value="${R}" aria-label="Distance to the right"><input class="b" data-edge="b" value="${B}" aria-label="Distance to the bottom"><input class="l" data-edge="l" value="${L}" aria-label="Distance to the left">
        <div class="inner"><span class="lab">Padding</span><input class="t" value="${pad[0]}" aria-label="Padding top" ${l.type === 'cta' ? '' : 'disabled'}><input class="r" value="${pad[1]}" aria-label="Padding right" ${l.type === 'cta' ? '' : 'disabled'}><input class="b" value="${pad[2]}" aria-label="Padding bottom" ${l.type === 'cta' ? '' : 'disabled'}><input class="l" value="${pad[3]}" aria-label="Padding left" ${l.type === 'cta' ? '' : 'disabled'}><div class="core">${px(l.w, 0)} x ${px(l.h, 1)}</div></div></div>`);
      h += ssec('size', 'Size', `<div class="f2"><span>Width</span><label class="fld"><input data-sz="w" value="${px(l.w, 0)}" aria-label="Width"><i>px</i></label><span>Height</span><label class="fld"><input data-sz="h" value="${px(l.h, 1)}" aria-label="Height"><i>px</i></label>
        <span>Min</span><label class="fld" title="The smallest the type may shrink to"><input value="${l.type === 'text' ? Math.round(W * 0.024) : ''}" placeholder="None" aria-label="Minimum type size" ${l.type === 'text' ? '' : 'disabled'}><i>px</i></label><span>Lines</span><label class="fld" title="The most lines the words may take"><input value="${l.type === 'text' ? (l.role === 'headline' ? 3 : 4) : ''}" placeholder="None" aria-label="Maximum lines" ${l.type === 'text' ? '' : 'disabled'}></label></div>`);
      if (l.type === 'text' || l.type === 'cta') {
        const ov = l.overflow || 'visible';
        h += ssec('overflow', 'Overflow', `<div class="seg" role="group" aria-label="When the words do not fit">${[['visible', I.eye, 'Show it'], ['hidden', I.eyeoff, 'Clip it'], ['fit', I.fit, 'Shrink to fit'], ['auto', 'Auto', 'Let the Studio decide']].map(([k, ic, t]) => `<button data-ov="${k}" aria-pressed="${ov === k}" title="${t}" aria-label="${t}">${ic}</button>`).join('')}</div>`);
        const g = groundUnder(l); const rr = ratio(hexOf(l.color), g.hex); const [gl, gc] = grade(rr);
        h += ssec('type', 'Typography', `<div class="frow"><span>Font</span><label class="fld"><select id="sFont" aria-label="Font">${['Manrope', 'DM Sans'].map(f => `<option ${(l.font || 'Manrope') === f ? 'selected' : ''}>${f}</option>`).join('')}</select>${I.down}</label></div>
          <div class="frow"><span>Weight</span><label class="fld"><select id="sWeight" aria-label="Weight">${[[500, 'Medium'], [600, 'Semibold'], [700, 'Bold'], [800, 'Extra bold']].map(([w, n]) => `<option value="${w}" ${l.weight === w ? 'selected' : ''}>${w} - ${n}</option>`).join('')}</select>${I.down}</label></div>
          <div class="f2" style="margin-top:10px"><span>Size</span><label class="fld"><input id="sSize" value="${Math.round(l.size / 100 * W)}" aria-label="Type size"><i>px</i></label><span>Height</span><label class="fld"><input id="sLead" value="${Math.round(l.size / 100 * W * (l.lead || 1.08))}" aria-label="Line height"><i>px</i></label></div>
          <div class="frow"><span>Color</span><button class="colorbtn" id="sColor" aria-label="Colour ${hexOf(l.color)}"><i style="background:${l.color}"></i>${hexOf(l.color)}</button></div>
          <div class="contrast"><span>Contrast with ${H.esc(g.what)}</span><span><b class="${gc}">${gl}</b> ${rr.toFixed(2)}</span></div>`);
      } else if (l.type === 'shape') {
        h += ssec('fill', 'Fill', `<div class="frow"><span>Color</span><button class="colorbtn" id="sColor" aria-label="Fill ${hexOf(l.fill)}"><i style="background:${l.fill}"></i>${hexOf(l.fill)}</button></div>`);
      } else if (l.type === 'logo') {
        h += ssec('fit', 'Fit', `<div class="frow"><span>Fit</span><label class="fld"><select aria-label="Fit"><option>Contain</option><option>Cover</option></select>${I.down}</label></div><div class="frow"><span>Variant</span><label class="fld"><select id="sTone" aria-label="Logo variant"><option value="dark" ${l.tone === 'dark' ? 'selected' : ''}>Dark, for gold and light grounds</option><option value="light" ${l.tone === 'light' ? 'selected' : ''}>Light, for blue and dark grounds</option></select>${I.down}</label></div><div class="rule"><b>Held by a campaign rule.</b> Harbour crossings keeps the logo bottom right with clear space of half its height. Moving it records that it moved against the rule.</div>`);
      }
    } else {
      h += `<div class="ssec"><div class="body" style="padding-top:16px;color:var(--ink-3);font-size:13px">Click a word, the band or the logo on the canvas to style it. The Add panel on the left adds elements; Templates rearrange the same words.</div></div>`;
    }
    S.innerHTML = h;
    $('#sSel').onchange = e => { st.sel = e.target.value || null; drawStudio(); };
    S.querySelectorAll('[data-sfold]').forEach(b => b.onclick = () => { folds['s_' + b.dataset.sfold] = folds['s_' + b.dataset.sfold] === false; drawStyle(); });
    if (!l) return;
    const commit = () => { drawTile(); drawStyle(); drawRail(); if (panel === 'checks' || panel === 'layers') drawFly(); };
    S.querySelectorAll('[data-edge]').forEach(inp => inp.onchange = () => { const v = +inp.value; if (!isFinite(v)) return; const [W, Hh] = dims(); const e = inp.dataset.edge; if (e === 't') l.y = pcOf(v, 1); if (e === 'l') l.x = pcOf(v, 0); if (e === 'r') l.w = Math.max(1, 100 - l.x - pcOf(v, 0)); if (e === 'b') l.y = 100 - l.h - pcOf(v, 1); commit(); });
    S.querySelectorAll('[data-sz]').forEach(inp => inp.onchange = () => { const v = +inp.value; if (!(v > 0)) return; if (inp.dataset.sz === 'w') l.w = pcOf(v, 0); else l.h = pcOf(v, 1); commit(); });
    S.querySelectorAll('[data-ov]').forEach(b => b.onclick = () => { l.overflow = b.dataset.ov; if (b.dataset.ov === 'fit') { const lines = Math.max(1, Math.floor((l.h * H.RATIO[doc().format]) / (l.size * 1.12))); while (l.size > 2.4 && (l.text || '').length * l.size * .5 > l.w * lines) l.size = +(l.size - .1).toFixed(2); toast('Shrunk to fit its box'); } commit(); });
    const f = $('#sFont'); if (f) f.onchange = () => { l.font = f.value; commit(); };
    const w = $('#sWeight'); if (w) w.onchange = () => { l.weight = +w.value; commit(); };
    const sz = $('#sSize'); if (sz) sz.onchange = () => { const v = +sz.value; if (v > 0) { l.size = v / dims()[0] * 100; commit(); } };
    const ld = $('#sLead'); if (ld) ld.onchange = () => { const v = +ld.value; if (v > 0) { l.lead = v / (l.size / 100 * dims()[0]); commit(); } };
    const tn = $('#sTone'); if (tn) tn.onchange = () => { l.tone = tn.value; commit(); };
    const c = $('#sColor'); if (c) c.onclick = () => openPicker(l, c);
  }
  /* the colour picker: saturation and brightness, hue, opacity, HSB numbers, the contrast it makes, the brand's saved colours */
  let pick = null;
  function hsvToHex(h, s, v) { const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); }; return '#' + [f(5), f(3), f(1)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('').toUpperCase(); }
  function hexToHsv(hex) { const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255); const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let h = 0; if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360; return [h, mx ? d / mx : 0, mx]; }
  function closePicker() { const p = $('#picker'); if (p) p.hidden = true; pick = null; }
  function openPicker(l, anchor) {
    const key = l.type === 'shape' ? 'fill' : 'color'; const [h0, s0, v0] = hexToHsv(hexOf(l[key])); pick = { l, key, h: h0, s: s0, v: v0, a: 100 };
    const p = $('#picker'); p.hidden = false; const r = anchor.getBoundingClientRect(); p.style.left = Math.max(12, r.left - 362) + 'px'; p.style.top = Math.max(12, Math.min(window.innerHeight - 480, r.top - 200)) + 'px';
    drawPicker();
  }
  function drawPicker() {
    if (!pick) return; const p = $('#picker'); const hex = hsvToHex(pick.h, pick.s, pick.v); const l = pick.l;
    const g = l.type === 'shape' ? null : groundUnder(l); const rr = g ? ratio(hex, g.hex) : null; const gr = rr ? grade(rr) : null;
    p.innerHTML = `<div class="sb" id="pSB" style="background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,${hsvToHex(pick.h, 1, 1)})" aria-label="Saturation and brightness"><span class="knob" style="left:${pick.s * 100}%;top:${(1 - pick.v) * 100}%"></span></div>
      <div class="prow"><button class="eyedrop" aria-label="Pick from the canvas" title="Pick from the canvas">${I.drop}</button><div class="sliders"><div class="slider hue" id="pHue" aria-label="Hue"><span class="knob" style="left:${pick.h / 360 * 100}%"></span></div><div class="slider alpha" id="pA" style="--cur:${hex}" aria-label="Opacity"><span class="knob" style="left:${pick.a}%"></span></div></div></div>
      <div class="pnums"><select aria-label="Colour model"><option>HSB</option><option>HEX</option></select><input id="pH" value="${Math.round(pick.h)}" aria-label="Hue"><input id="pS" value="${Math.round(pick.s * 100)}" aria-label="Saturation"><input id="pB" value="${Math.round(pick.v * 100)}" aria-label="Brightness"><input value="${pick.a}%" aria-label="Opacity" readonly></div>
      ${rr ? `<div class="prat"><span>Contrast ratio</span><span><b class="${gr[1]}">${gr[0]}</b><b>${rr.toFixed(2)}</b></span></div><div style="font-size:12px;color:var(--ink-3);margin:0 2px">against ${H.esc(g.what)}</div>` : ''}
      <div class="psaved">Saved colors (Harbourline)</div><div class="psw">${SAVED.map(([n, c]) => `<button style="background:${c}" data-sw="${c}" aria-label="${n} ${c}" aria-pressed="${c === hex}"></button>`).join('')}</div>`;
    const sync = () => { const hx = hsvToHex(pick.h, pick.s, pick.v); const sbx = $('#pSB'); sbx.style.background = `linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,${hsvToHex(pick.h, 1, 1)})`; const k = sbx.querySelector('.knob'); k.style.left = pick.s * 100 + '%'; k.style.top = (1 - pick.v) * 100 + '%'; $('#pHue .knob').style.left = pick.h / 360 * 100 + '%'; $('#pA').style.setProperty('--cur', hx); $('#pA .knob').style.left = pick.a + '%'; $('#pH').value = Math.round(pick.h); $('#pS').value = Math.round(pick.s * 100); $('#pB').value = Math.round(pick.v * 100); p.querySelector('input[readonly]').value = pick.a + '%'; p.querySelectorAll('[data-sw]').forEach(b => b.setAttribute('aria-pressed', b.dataset.sw === hx)); const pr = p.querySelector('.prat'); if (pr && g) { const r3 = ratio(hx, g.hex), g3 = grade(r3); pr.lastElementChild.innerHTML = `<b class="${g3[1]}">${g3[0]}</b><b>${r3.toFixed(2)}</b>`; } };
    const apply = () => { const hx = hsvToHex(pick.h, pick.s, pick.v); l[pick.key] = pick.a < 100 ? `rgba(${[1, 3, 5].map(i => parseInt(hx.slice(i, i + 2), 16)).join(',')},${pick.a / 100})` : hx; drawTile(); sync(); const sc = $('#sColor'); if (sc) { sc.innerHTML = `<i style="background:${l[pick.key]}"></i>${hexOf(l[pick.key])}`; } const ct = document.querySelector('#style .contrast'); if (ct && g) { const r2 = ratio(hexOf(l[pick.key]), g.hex), g2 = grade(r2); ct.lastElementChild.innerHTML = `<b class="${g2[1]}">${g2[0]}</b> ${r2.toFixed(2)}`; } };
    const track = (el, fn) => { el.onpointerdown = e => { el.setPointerCapture(e.pointerId); const go = ev => { const r = el.getBoundingClientRect(); fn(Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)), Math.max(0, Math.min(1, (ev.clientY - r.top) / r.height))); apply(); }; go(e); el.onpointermove = ev => { if (ev.buttons) go(ev); }; }; };
    track($('#pSB'), (x, y) => { pick.s = x; pick.v = 1 - y; }); track($('#pHue'), x => { pick.h = x * 360; }); track($('#pA'), x => { pick.a = Math.round(x * 100); });
    [['pH', v => pick.h = Math.max(0, Math.min(360, v))], ['pS', v => pick.s = Math.max(0, Math.min(100, v)) / 100], ['pB', v => pick.v = Math.max(0, Math.min(100, v)) / 100]].forEach(([id, fn]) => { $('#' + id).onchange = e => { const v = +e.target.value; if (isFinite(v)) { fn(v); apply(); } }; });
    p.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => { [pick.h, pick.s, pick.v] = hexToHsv(b.dataset.sw); pick.a = 100; apply(); });
  }
  document.addEventListener('pointerdown', e => { const p = $('#picker'); if (!p || p.hidden) return; const path = e.composedPath ? e.composedPath() : [e.target]; if (path.includes(p) || path.some(n => n && n.id === 'sColor')) return; closePicker(); });
  function drawVersions() {
    const vs = st.versions[st.piece]; $('#vstrip').innerHTML = '<span class="lbl">Versions</span>' + vs.map((v, i) => `<button class="vcard${i === vs.length - 1 ? ' on' : ''}" data-vs="${i}" title="v${v.n}: ${H.esc(v.note)}" aria-label="Version ${v.n}"><div data-vst="${i}"></div><em>v${v.n}</em></button>`).join('') + '<button class="ed-btn" id="saveV" style="margin-left:6px">Save as a version</button>';
    document.querySelectorAll('[data-vst]').forEach(el => { const v = vs[+el.dataset.vst]; H.renderTile(el, v.lay); if (!v.img) { const sk = document.createElement('div'); sk.className = 'sketch'; sk.style.fontSize = '0'; el.prepend(sk); } });
    document.querySelectorAll('[data-vs]').forEach(b => b.onclick = () => { const v = vs[+b.dataset.vs]; st.docs[st.piece] = JSON.parse(JSON.stringify(v.lay)); toast('Showing v' + v.n + '; save to make it the newest'); drawStudio(); });
    $('#saveV').onclick = () => { vs.push({ n: vs.length + 1, note: 'saved on the canvas', lay: JSON.parse(JSON.stringify(doc())), img: vs[vs.length - 1].img }); toast('Saved v' + vs.length); drawStudio(); };
  }
  $('#edMenu').onclick = () => { const m = $('#menuPop'); m.hidden = !m.hidden; $('#edMenu').setAttribute('aria-expanded', !m.hidden); };
  $('#backSteps').onclick = () => { $('#menuPop').hidden = true; leaveStudio(); go(3); };
  $('#menuReview').onclick = () => { $('#menuPop').hidden = true; leaveStudio(); complete(4, 5); };
  $('#toReview').onclick = () => { leaveStudio(); complete(4, 5); };
  $('#genBtn').onclick = () => {
    const piece = st.piece;
    startRun({ label: 'Generating the photograph', role: 'Image model · 2K', typical: 14, phases: ['preparing the brief and references', 'generating the image', 'filing it as a new version'], onDone: () => { const vs = st.versions[piece]; vs.push({ n: vs.length + 1, note: 'photograph: Pier 2 at first light', lay: JSON.parse(JSON.stringify(st.docs[piece])), img: true }); st.imagery = true; if ($('#studio').classList.contains('on')) drawStudio(); return 'new version v' + vs.length + ' with the photograph'; } });
    drawTop(); toast('Generating in the background. Keep editing; your changes are kept when the image lands.');
  };
  window.addEventListener('resize', () => { if ($('#studio').classList.contains('on')) { drawSel(); drawTop(); } });
  document.addEventListener('keydown', e => {
    if (!$('#studio').classList.contains('on')) return;
    if (e.key === 'Escape') { if (!$('#picker').hidden) return closePicker(); if (!$('#menuPop').hidden) { $('#menuPop').hidden = true; return; } st.sel = null; return drawStudio(); }
    const l = st.sel && layer(st.sel); if (!l || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || !/^Arrow/.test(e.key)) return;
    if (l.locked || l.type === 'logo') return; e.preventDefault();
    const n = e.shiftKey ? 10 : 1; if (e.key === 'ArrowLeft') l.x -= pcOf(n, 0); if (e.key === 'ArrowRight') l.x += pcOf(n, 0); if (e.key === 'ArrowUp') l.y -= pcOf(n, 1); if (e.key === 'ArrowDown') l.y += pcOf(n, 1);
    drawTile(); drawStyle();
  });

  /* ---- render ---- */
  function render() {
    drawSteps(); const c = $('#col'); const s = STAGES[st.stage].id;
    if (s === 'design') { c.innerHTML = '<span class="eyebrow">Step 5 of 7</span><h2>The canvas is open.</h2><p class="lead">Design fills the window. Use Steps (top left) to come back here.</p><button class="btn primary" id="reopen">Back to the canvas</button>'; $('#reopen').onclick = enterStudio; if (!$('#studio').classList.contains('on')) enterStudio(); else drawStudio(); return; }
    leaveStudio();
    c.innerHTML = s === 'brief' ? stageBrief() : s === 'shape' ? stageShape() : s === 'dir' ? stageDir() : s === 'copy' ? stageCopy() : s === 'review' ? stageReview() : stageExport();
    if (s === 'brief') bindBrief();
    if (s === 'shape') $('#okShape').onclick = () => complete(1, 2);
    if (s === 'dir') { document.querySelectorAll('[data-th]').forEach(el => H.renderTile(el, H.layout('4:5', el.dataset.th))); document.querySelectorAll('input[name=dir]').forEach(i => i.onchange = () => { st.dir = i.value; }); $('#okDir').onclick = () => complete(2, 3); }
    if (s === 'copy') {
      document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { st.piece = b.dataset.p; render(); });
      ['headline', 'support', 'cta', 'caption', 'alt'].forEach(k => { const i = $('#c_' + k); i.oninput = () => { st.copy[st.piece][k] = i.value; st.copyReady[st.piece] = false; const l = st.docs[st.piece].layers.find(x => x.role === k); if (l) l.text = i.value; }; i.onchange = render; });
      $('#shorter').onclick = () => { const piece = st.piece; startRun({ label: 'Shorter headline options', role: 'Creative model', typical: 7, phases: ['reading the brief, the copy and your rules', 'writing three options', 'checking them against your facts and banned terms'], onDone: () => { st.sugg = { piece, opts: ['Two more crossings from Monday.', 'More morning crossings from 9 March.', 'Two new morning ferries from Pier 2.'] }; return '3 options beside the headline'; } }); render(); };
      document.querySelectorAll('[data-use]').forEach(b => b.onclick = () => { const v = st.sugg.opts[+b.dataset.use]; st.copy[st.piece].headline = v; const l = st.docs[st.piece].layers.find(x => x.role === 'headline'); if (l) l.text = v; st.sugg = null; render(); });
      $('#ready').onclick = () => { st.copyReady[st.piece] = !st.copyReady[st.piece]; render(); };
      $('#okCopy').onclick = () => { complete(3, 4); };
    }
    if (s === 'review') {
      document.querySelectorAll('[data-rv]').forEach(el => { const v = st.versions[el.dataset.rv]; H.renderTile(el, st.docs[el.dataset.rv]); if (!v[v.length - 1].img) { const sk = document.createElement('div'); sk.className = 'sketch'; sk.style.fontSize = '0'; el.prepend(sk); } });
      document.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => { st.approved[b.dataset.approve] = true; toast('Approved by you, for this exact version'); render(); });
      document.querySelectorAll('[data-fix]').forEach(b => b.onclick = () => { st.piece = b.dataset.fix; st.sel = 'support'; go(4); });
      $('#okReview').onclick = () => complete(5, 6);
    }
    if (s === 'export') { $('#pack').onclick = () => startRun({ label: 'Preparing the package', role: 'Your browser and the worker · no model call', typical: 5, phases: ['drawing each approved piece at full size', 'writing the copy sheet and manifest'], onDone: () => 'package ready to download' }); $('#share').onclick = () => toast('A private review link, 14 days, for the approved pieces only (prototype)'); }
  }
  st.docs.st.layers.find(l => l.id === 'support').y = 82;   // the story starts with a real problem to fix on the canvas
  render();
})();
