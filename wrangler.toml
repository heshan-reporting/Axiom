# AXIOM worker deploy config.
#
# Deploy:  wrangler deploy
#
# IMPORTANT — preserving your existing KV data:
#   The KV *namespace ID* is NOT stored in the worker .js. It lives on your
#   Cloudflare account as the AXIOM_KV binding. To keep all cached data
#   (pulse_history, feed_cb, /allnews caches, feed circuit-breaker), this
#   file must point AXIOM_KV at your EXISTING namespace id.
#
#   Find it:   wrangler kv namespace list
#              (or Cloudflare dashboard -> Workers & Pages -> KV)
#   Then paste it into `id` below, replacing PASTE_EXISTING_NAMESPACE_ID.
#
#   `name` must stay "newsaus" so this UPDATES the existing worker (and keeps
#   its secrets + bindings) rather than creating a new one.
#
# Prefer zero-risk? Skip wrangler and paste the new code into the dashboard
# editor instead — that updates only the code and leaves KV + secrets intact.

name = "newsaus"
main = "axiomworkerv4.js"
compatibility_date = "2025-01-01"

# Every 30 min: time-series snapshot, cache pre-warm, and the permanent
# D1 archive sweep (news + social + forums) so collection runs with
# nobody watching.
[triggers]
crons = ["7,37 * * * *"]

# Keep the SAME namespace id your worker already uses.
[[kv_namespaces]]
binding = "AXIOM_KV"
id = "PASTE_EXISTING_NAMESPACE_ID"

# ── THE CURIOUS MIND (Phase 5) — create these once, then uncomment. ─────────
# 1) Vectorize index (768 dims to match the Workers AI bge embedding model):
#      wrangler vectorize create axiom-mind --dimensions=768 --metric=cosine
# 2) D1 database:   wrangler d1 create axiom-mind-db   (paste its id below)
# 3) R2 bucket:     wrangler r2 bucket create axiom-mind-docs
# (All three can also be created + bound in the dashboard: Worker -> Settings
#  -> Bindings. Without them, /mind/* routes return a clear 501 and the rest
#  of AXIOM is unaffected.)
#
# [[vectorize]]
# binding = "MIND_VECTORS"
# index_name = "axiom-mind"
#
# [ai]
# binding = "AI"
#
# [[d1_databases]]
# binding = "MIND_DB"
# database_name = "axiom-mind-db"
# database_id = "PASTE_D1_DATABASE_ID"
#
# [[r2_buckets]]
# binding = "MIND_DOCS"
# bucket_name = "axiom-mind-docs"

# ── Full step-by-step install: see SETUP.md in the repo root. ──────────────
#
# ── Secrets are NOT stored here. Set each with `wrangler secret put <NAME>`:
#   ANTHROPIC_API_KEY (Creative Studio chat, Mind analysis, Sentinel angles)
#   GEMINI_KEY        (image engine /nano + copy + link summarization)
#   AXIOM_ACCESS_KEY  (single full-access key gating the private routes)
#   AXIOM_KEYS        (per-person keys with roles, JSON on one line:
#                      {"k1":{"n":"Heshan","r":"full"},"k2":{"n":"Steve","r":"read"}}
#                      role "read" may only hit read routes; writes return 403)
#   META_TOKEN        (Meta Business System User token: ads_read + read_insights;
#                      pulls campaign-level daily insights -> archive kind 'campaign')
#   META_AD_ACCOUNTS  (plain text var: "act_123:mca,act_456:aep" - ad account -> client ns)
#   META_USER_TOKEN   (ID-verified user token with ads_read for the Ad Library
#                      opposition sweep -> archive kind 'oppads'; expires ~60 days)
#   CLICKUP_TOKEN     (create tasks)     CLICKUP_LIST_ID (optional default list)
#   GUARDIAN_KEY      (Guardian API, optional)
#   TVFY_KEY          (They Vote For You, optional)
#   WA_TOKEN, WA_PHONE_ID                (WhatsApp Cloud API, optional)
#   TWILIO_SID, TWILIO_AUTH, TWILIO_WA_FROM  (Twilio WhatsApp, optional)
# Existing secrets are preserved across deploys — you only set new/changed ones.
